name: Retag (one-off)
# Jednorazove: presune znacky vydani na prepsanou historii (po vycisteni loga z gitu).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git push -f origin bc0dfaa8dd4705267c591445cf8345ef12d372a0:refs/tags/v2.0.0-beta.1
          git push -f origin 818ef4f1352dd3ba4e966b3fb7ab43b589e08083:refs/tags/v2.0.0-beta.2
          git push -f origin 39e26bca42876bd8030173f7073a75422bd7381b:refs/tags/v2.0.0-beta.3
          git ls-remote origin
