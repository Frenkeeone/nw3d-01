; Alternativa k Arduino IDE: PlatformIO (VS Code). Zdrojaky jsou ve slozce NW3D_Eyes.
[platformio]
src_dir = NW3D_Eyes

[env:dualeye]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.2.19
  https://github.com/knolleary/pubsubclient.git#v2.8
  https://github.com/bblanchon/ArduinoJson.git#v7.4.2
